font=JetBrainsMono Nerd Font Mono:size=11
pad=8x8                             # 0x0 makes Neovim flush against edges
initial-window-size-chars=120x35

[cursor]
style=block
blink=no

[colors-dark]
background=282828
foreground=dfbf8e

# Normal colors
regular0=282828  # black
regular1=ea6962  # red
regular2=a9b665  # green
regular3=d8a657  # yellow
regular4=7daea3  # blue
regular5=d3869b  # magenta
regular6=89b482  # cyan
regular7=dfbf8e  # white

# Bright colors
bright0=928374   # bright black
bright1=ea6962   # bright red
bright2=a9b665   # bright green
bright3=d8a657   # bright yellow
bright4=7daea3   # bright blue
bright5=d3869b   # bright magenta
bright6=89b482   # bright cyan
bright7=dfbf8e   # bright white
